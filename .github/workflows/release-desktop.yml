name: release-desktop

# Builds the portable dsh-desktop release and attaches it to a GitHub Release.
#
# The package is self-contained (shell exe + bundled harness tree + portable
# Node), so a fresh Windows machine only needs to unzip it and run
# install-offline.ps1 - see scripts/pack-release.ps1 for the layout.
#
# Trigger it by pushing a tag like `desktop-v0.1.0`, or manually (Actions ->
# release-desktop -> Run workflow) and give the tag to create/update.
#
# The release step uses the built-in GITHUB_TOKEN (permissions: contents: write)
# - no PAT is needed for releasing. Pushing THIS file to the repository once
# requires a credential with the `workflow` scope.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create or update (e.g. desktop-v0.1.0)'
        required: true
      dsh_version:
        description: 'Harness version to bundle (blank = npm latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # The shell is built with Go 1.26+ (see README prerequisites).
          go-version: '1.26.x'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          "$env:USERPROFILE\go\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build the shell
        shell: pwsh
        run: |
          Push-Location frontend; npm install --no-audit --no-fund; Pop-Location
          wails build
          if (-not (Test-Path build\bin\dsh-desktop.exe)) { throw "wails build produced no exe" }

      - name: Stage the harness runtime (offline dependency tree)
        shell: pwsh
        run: |
          # The version is PINNED on purpose (project-facts F10): "npm latest"
          # would silently change what we ship. HARNESS_BEFORE guards against an
          # upstream PARTIAL prerelease family: on 2026-09-22 upstream published
          # dsh@0.1.5-rc.3 for most packages but NOT for
          # @deepseek-ai/dsh-client-ui-sidebar-documentpreview; since rc.2 declares
          # caret ranges (^0.1.5-rc.2), a plain install of rc.2 now resolves rc.3
          # sub-packages -> ETARGET (this broke release run #11). --before keeps
          # resolution at the chosen registry state.
          #
          # RAISED to 0.1.7-rc.1 on 2026-09-24 (HANDOVER 42): 0.1.5-rc.2 aborts on
          # start-up with "user patch-layer watching requires the Cordis HMR
          # service" whenever @deepseek-ai/cordis-plugin-hmr is resolvable - which
          # it IS in this portable (nested) layout, but NOT in a hoisted global
          # npm install. So the failure only ever appeared on a clean target
          # machine, never on the dev box. Every package up to 0.1.12 shipped a
          # runtime that could not start on a fresh machine.
          #
          # RAISED to 0.1.7-rc.2 on 2026-09-28 for the 0.1.15 release: rc.2 is what
          # npm `latest` points at and what the dev box runs (HANDOVER 47). With it
          # $before moved to 2026-09-25 because THE GATE MUST SIT AFTER THE PINNED
          # VERSION'S PUBLISH TIME (rc.2 was published 2026-09-24T14:18Z; the old
          # gate at 2026-09-24T00:00Z would hide rc.2 from resolution) - see
          # project-facts F17.
          #
          # NOTE: $before must sit AFTER the pinned version's publish date,
          # otherwise resolution can never see it.
          $before = "2026-09-25T00:00:00.000Z"
          $pinned = "0.1.7-rc.2"
          $dsh = "${{ inputs.dsh_version }}"
          if (-not $dsh) { $dsh = $pinned }
          Write-Host "bundling @deepseek-ai/dsh@$dsh (registry state before $before)"
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          npm install --prefix staging --no-audit --no-fund --before="$before" "@deepseek-ai/dsh@$dsh"
          if (-not (Test-Path staging\node_modules\@deepseek-ai\dsh\lib\bin.js)) {
            throw "harness tree incomplete: staging\node_modules\@deepseek-ai\dsh\lib\bin.js missing"
          }
          $probe = (& node staging\node_modules\@deepseek-ai\dsh\lib\bin.js --version 2>$null)
          Write-Host "bundled runtime reports: $probe"
          if ("$probe".Trim() -ne $dsh) { throw "bundled runtime reports '$probe', want '$dsh'" }
          "DSH_VERSION=$dsh" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download portable Node.js (bundled runtime)
        shell: pwsh
        run: |
          $ver = (node --version).TrimStart('v')
          $url = "https://nodejs.org/dist/v$ver/node-v$ver-win-x64.zip"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile node.zip
          Expand-Archive node.zip -DestinationPath node-dist -Force
          $src = "node-dist\node-v$ver-win-x64"
          Copy-Item "$src\node.exe" staging\node.exe -Force
          if (Test-Path "$src\LICENSE") { Copy-Item "$src\LICENSE" staging\LICENSE -Force }
          # The packer takes npm from the folder that holds node.exe, so npm must
          # travel with it - otherwise the portable shell cannot self-update.
          Copy-Item "$src\node_modules\npm" staging\node_modules\npm -Recurse -Force
          if (-not (Test-Path staging\node_modules\npm\bin\npm-cli.js)) {
            throw "npm was not staged next to node.exe; the package would not be able to self-update"
          }
          "NODE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Gate: the staged runtime must actually BOOT, not merely print a version.
      # Regression guard for HANDOVER 42: every package up to 0.1.12 bundled a
      # harness that crashed on start-up in this exact (nested) layout, yet passed
      # the version probe and shipped. Boot it against an empty DSH_HOME here so a
      # start-up crash can never reach a Release again.
      - name: Verify the staged runtime boots
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $home_ = Join-Path $env:RUNNER_TEMP "boot-home"
          New-Item -ItemType Directory -Force -Path $home_ | Out-Null
          $out = Join-Path $env:RUNNER_TEMP "boot-out.txt"
          $err = Join-Path $env:RUNNER_TEMP "boot-err.txt"
          $env:DSH_HOME = $home_
          # --port 0 lets the OS pick a free port; stdio goes to files so a crash
          # still leaves evidence behind.
          $p = Start-Process -FilePath "staging\node.exe" `
            -ArgumentList "staging\node_modules\@deepseek-ai\dsh\lib\bin.js","web","--no-open","--port","0" `
            -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          $deadline = (Get-Date).AddSeconds(120)
          $up = $false
          $code = ""
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { break }
            if (-not (Test-Path $out)) { continue }
            # -Raw returns $null while the file is still empty; [regex]::Match
            # throws on a null input, so read it safely first.
            $text = Get-Content $out -Raw -ErrorAction SilentlyContinue
            if ([string]::IsNullOrEmpty($text)) { continue }
            $m = [regex]::Match($text, 'dsh web: http://127\.0\.0\.1:(\d+)/')
            if (-not $m.Success) { continue }
            # curl.exe, NOT Invoke-WebRequest: the fence answers 401, which IWR
            # raises as a terminating error whose catch-block handling differs
            # between PS editions (it blew up run #19 with
            # ParentContainsErrorRecordException). curl simply prints a code.
            $code = (& curl.exe -s -o NUL -w "%{http_code}" --max-time 5 "http://127.0.0.1:$($m.Groups[1].Value)/") 2>$null
            if ("$code" -match '^\d+$' -and [int]"$code" -gt 0) { $up = $true; break }   # 401 = expected
          }
          $alive = -not $p.HasExited
          if ($alive) { $p.Kill() }
          if (-not $alive) {
            Write-Host "--- stderr tail ---"
            if (Test-Path $err) { Get-Content $err -Tail 25 | ForEach-Object { Write-Host $_ } }
            throw "the staged runtime EXITED during boot - do not ship this package (HANDOVER 42)"
          }
          if (-not $up) {
            Write-Host "--- stdout tail ---"
            if (Test-Path $out) { Get-Content $out -Tail 25 | ForEach-Object { Write-Host $_ } }
            throw "the staged runtime never served HTTP - do not ship this package"
          }
          Write-Host "staged runtime booted and served HTTP successfully"

      - name: Pack the portable release
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = $env:GITHUB_REF_NAME }
          $shellVersion = $tag -replace '^desktop-v', ''
          Write-Host "packing for tag $tag (shell version $shellVersion)"
          # The release title wants the BARE version, and a GitHub expression cannot
          # strip the tag prefix, so hand it to the publish step through the env.
          "SHELL_VERSION=$shellVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          # TWO artifacts since 0.1.15 (user decision, HANDOVER 49): slim is the
          # default download; full keeps the 325 MB LibreOffice engine so the
          # sidebar can preview Office documents.
          #
          # Each variant packs into its OWN folder (the packer only prunes zips of
          # the same variant, and separate folders also keep one LATEST.txt per
          # variant); both zips are then lifted into dist\ for the release step.
          # Note the slim run does NOT strip the source runtime: pack-release.ps1
          # copies the tree into its own package staging first ($rt =
          # <pkgDir>\runtime), so the full run still sees the engine.
          foreach ($variant in @("slim", "full")) {
            Write-Host "=== packing variant: $variant ==="
            pwsh -File scripts/pack-release.ps1 `
              -RuntimeSource staging `
              -DshVersion "$env:DSH_VERSION" `
              -ShellVersion "$shellVersion" `
              -Variant $variant `
              -OutDir "dist\$variant"
            if ($LASTEXITCODE -ne 0) { throw "pack-release.ps1 -Variant $variant failed (exit $LASTEXITCODE)" }
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem dist -Recurse -File -Filter *.zip |
            ForEach-Object { Move-Item $_.FullName (Join-Path "dist" $_.Name) -Force }
          # One combined checksum file covering BOTH assets (verify-release.mjs
          # reads it to check each asset's digest).
          Get-ChildItem dist -File -Filter *.zip | Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } |
            Set-Content -Path dist\SHA256SUMS.txt -Encoding ascii
          Get-ChildItem dist -File | Select-Object Name, Length | Format-Table -AutoSize
          Get-Content dist\SHA256SUMS.txt

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: dsh-desktop ${{ env.SHELL_VERSION }}（便携包 · 瘦身/整合 双版本 · Windows x64）
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          # NOTE (maintenance): the plugin table below mirrors scripts/setup-plugins.mjs
          # PLUGINS. When the plugin list changes, update this table AND the "插件" row
          # above it, the same way README.md's table is updated (HANDOVER §28).
          body: |
            **dsh-desktop 便携发行包**：解压即用，目标机**不需要** Node.js、npm、Go 或 Wails。

            **两个包，按需下一个**（0.1.15 起同时发布）

            | 包 | 大约 | 差别 | 建议 |
            |---|---|---|---|
            | `...-win-x64-slim.zip` | 112 MB | **不含** LibreOffice 引擎 ⇒ 侧栏**不能**预览 `.docx`/`.xlsx`，其余功能完全一样 | **默认选它**（下载、拷贝都快） |
            | `...-win-x64-full.zip` | 224 MB | **含** LibreOffice 引擎 ⇒ 侧栏可直接**预览 Office 文档** | 需要看 Word/Excel 的选它 |

            > 两者的壳、核心、插件、安装器完全相同，只差那一个引擎；插件装好后功能一致。

            | 项 | 值 |
            |---|---|
            | 壳 | commit `${{ github.sha }}` |
            | 核心 | `@deepseek-ai/dsh ${{ env.DSH_VERSION }}`（离线内置） |
            | Node | `24.x` 便携运行时（`${{ env.NODE_VERSION }}`） |
            | npm | 已内置 —— 便携壳与源码装一样**能自更新** |
            | 插件 | 6 个自定义插件随包（**壳面板里点一下就能装**，见下） |

            **快速开始**

            1. 把 zip 解压到任意目录（例如 `D:\dsh-desktop`）
            2. 双击 `dsh-desktop.exe` —— 首次启动会先解压内置运行时（约 40 秒，只此一次）
            3. **装插件**：点壳面板上的「**安装全部插件**」按钮 —— 它**一键装好全部 6 个插件**然后自己退出（控制台窗口闪一下是正常的，**装完不需要按任何键**）
            4. 脚本退出后点面板上的「**重启服务**」，插件即生效
            5. 想跳过界面先解压运行时：`dsh-desktop.exe --extract-runtime`

            > 想**自己挑插件**：双击 `install-offline.cmd`，或 `install-offline.ps1 -Plugins 2,4`（按编号选）/ `-Plugins ask`（交互菜单）。
            > 面板那个按钮走的是**同一个安装器**，只是固定用 `-Plugins all`：一键装全部、没有菜单（**0.1.15 起面板文案已写明**）。

            **6 个内置插件**（安装菜单显示同一份说明，单一数据源 = `scripts\setup-plugins.mjs --describe`）

            | 编号 | 短名 | 说明 | 在哪看到 |
            |---|---|---|---|
            | 1 | core-version | 核心版本徽标 | 界面左下角 |
            | 2 | explainer | 插件说明面板（逐插件中文说明 + 一键开关） | 设置 →「插件」 |
            | 3 | model-capabilities | 模型能力清单（能否识图 / 上下文 / 推理档位） | 设置 →「模型能力」 |
            | 4 | model-sync | 模型同步（拉候选、逐字段对比后写回配置） | 设置 →「模型」→ 提供商卡片 |
            | 5 | project-explorer | 项目文件树（拖文件即插路径） | 界面最右侧 |
            | 6 | provider-presets | 预置供应商（vekenllm / 电信算力的完整配置预制，点「启用」即用；**密钥由你在面板里输入，随包不携带任何密钥**） | 设置 →「模型」页面底部 |

            **更新**：壳启动时以及每 24 小时会查一次 npm registry，发现新版就用**包内 npm** 下载到暂存目录，下次启动换入（只作用于 harness，`node.exe` 与**包内 npm** 都不动）；也可以直接解压更新版覆盖本目录。

            **注意**

            - 包内**不含**任何 API Key / `.env`：每台机器自己配（预置供应商面板里填，或在设置里填）
            - 未签名构建：首次运行可能有 SmartScreen 提示
            - 端口固定 **43080**；会话与配置在 `$DSH_HOME`（`%USERPROFILE%\.dsh`），更新不丢
            - **自更新修好了（0.1.16）**：此前版本只要成功自更新过一次，换入新核心时会把**包内 npm 一起换掉**，之后点「更新核心」只会提示「本包未内置 npm，无法自更新」；本版换入时保留 npm，并能从 `runtime.zip` 自动把已丢失的 npm 补回
            - 请保持目录结构（壳按 exe 同级的 `runtime\` 解析便携运行时）；**每个用户单实例**
            - 拷贝/分发请**搬 zip**；必须拷目录时用 `robocopy <源> <目标> /E /MT:16 /NFL /NDL /NJH /NJS /NP`
            - 插件改动需**完全退出壳并重启**才生效（只刷新浏览器无效）
