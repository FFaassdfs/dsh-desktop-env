<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>DeepSeek Harness</title>
</head>
<body>
<div id="app">
    <div class="panel">
        <div class="header">
            <div class="title">DeepSeek Harness</div>
        </div>
        <div class="status" id="status"><span class="dot"></span><span id="statusText">正在启动…</span></div>
        <div class="url" id="url">—</div>
        <div class="actions">
            <button id="open" class="primary" disabled>在浏览器打开</button>
            <div class="actionRow">
                <button id="restart">重启服务</button>
                <button id="quit" class="ghost">退出</button>
            </div>
        </div>
        <!-- 核心版本选择器：各通道最新版本 + 逐版本更新/跳过（后端只在用户点按钮时安装） -->
        <div class="core">
            <div class="coreHead">
                <span class="coreLabel">核心版本</span>
                <span class="coreInstalled" id="coreInstalled">—</span>
                <button class="mini" id="coreRefresh" title="重新从 npm 读取可用版本">↻</button>
            </div>
            <div class="coreList" id="coreList">
                <div class="coreEmpty">读取可用版本…</div>
            </div>
            <div class="coreFoot" id="coreFoot"></div>
        </div>
        <!-- 预置插件安装：只有便携发行包（exe 同级有 install-offline.ps1）才显示 -->
        <div class="plugins" id="pluginsBox" hidden>
            <div class="pluginsHead">
                <span class="pluginsLabel">预置插件</span>
                <span class="pluginsDesc">装进 dsh，让界面多出说明/文件树/模型能力等功能</span>
            </div>
            <div class="pluginsRow">
                <button class="mini primary" id="installPlugins">安装插件…</button>
                <span class="pluginsNote" id="pluginsNote"></span>
            </div>
        </div>
        <div class="update" id="update">检查更新…</div>
        <div class="hint" id="hint"></div>
    </div>
</div>
<script src="./src/main.js" type="module"></script>
</body>
</html>
